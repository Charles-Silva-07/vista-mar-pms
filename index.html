<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Evita que o Chrome ofereça/ative a tradução automática da página.
         Quando o Google Translate traduz, ele reescreve nós do DOM por fora
         do React; ao reabrir um <Select> o React tenta atualizar esses nós
         e quebra com "Algo deu errado". Ver: origem deste bug reportado
         quando a tradução automática estava ativa. -->
    <meta name="google" content="notranslate" />
    <title>Alameda Pousada — PMS &amp; Financeiro</title>
    <meta
      name="description"
      content="Sistema de gestão hoteleira para pousadas: mapa de reservas, check-in, FNRH e fluxo de caixa em um só painel."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Alameda Pousada — PMS & Financeiro" />
    <meta
      property="og:description"
      content="Sistema de gestão hoteleira para pousadas: mapa de reservas, check-in, FNRH e fluxo de caixa em um só painel."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <link rel="icon" href="/logo-alameda.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
  </head>
  <body class="notranslate" translate="no">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
